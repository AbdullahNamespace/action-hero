# ═══════════════════════════════════════════════════════════
# 🔐 06 — Secrets · Vars · Permissions (الأمان)
# Lesson / الدرس: docs/06-secrets-vars-permissions.md · docs/06-secrets-vars-permissions.ar.md
# Concepts: secrets · vars · env · masking · least privilege · injection
# ───────────────────────────────────────────────────────────
# المطلوب في Settings → Secrets and variables → Actions:
#   Secret  : DEMO_SECRET
#   Variable: DEMO_VAR
# ═══════════════════════════════════════════════════════════
name: 06 · Secrets

on:
  workflow_dispatch:

# 🔒 نبدأ بلا صلاحيات، ثم نمنح كل job ما يحتاجه فقط
permissions: {}

# env على مستوى الـ workflow: قيمة عادية مكتوبة في الملف نفسه
env:
  APP_ENV: demo

jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read # الحد الأدنى لعمل checkout
    env:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }} # مخفي في اللوج
      DEMO_VAR: ${{ vars.DEMO_VAR }} # ظاهر في اللوج
    steps:
      - uses: actions/checkout@v7

      # 0) المصادر الثلاثة جنبًا إلى جنب
      - name: 🧭 env vs vars vs secrets
        run: |
          echo "env    : $APP_ENV"     # من الملف
          echo "var    : $DEMO_VAR"    # تظهر كما هي
          echo "secret : $DEMO_SECRET" # تظهر ***

      # 1) الإخفاء التلقائي: الطول يظهر عادي، القيمة ***
      - name: 🙈 محاولة طباعة السر
        run: |
          echo "القيمة: $DEMO_SECRET"
          echo "الطول : ${#DEMO_SECRET}"

      # 2) إخفاء قيمة ديناميكية لم تأتِ من secrets
      - name: 🎭 add-mask لقيمة مولّدة
        run: |
          TOKEN="tmp-$(date +%s)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN"

      # 3) ⚠️ الإخفاء ليس سحرًا: base64 أو تقسيم السر يكسر القناع.
      #    لذلك لا تطبع الأسرار أصلًا.

      # 4) Injection: لا تضع مدخلات المستخدم مباشرة داخل run
      #    ❌ run: echo "${{ github.event.pull_request.title }}"
      #    ✅ مرّرها عبر env كما هنا
      - name: 🛡️ طريقة آمنة لاستخدام مدخل خارجي
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "المنفّذ: $ACTOR"
